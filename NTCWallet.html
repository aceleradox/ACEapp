<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTC Wallet - Secure File Vault & Cyber Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- CDNs via Cloudflare -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.321.0/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/17.0.2/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/17.0.2/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.0/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap');
    
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #06060c;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0b14;
    }
    ::-webkit-scrollbar-thumb {
      background: #25103c;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #db2777;
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between">

  <div id="root" class="flex-grow flex flex-col"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef } = React;

    const MNEMONIC_WORDS = [
      "matrix", "net", "cyber", "token", "neon", "flow", "delta", "fusion", 
      "protocol", "node", "quantum", "sync", "hash", "link", "grid", "shield", 
      "code", "engine", "plasma", "vortex", "acelera", "notoriety", "glow", "wallet"
    ];

    const generateNewSeed = () => {
      let words = [];
      for (let i = 0; i < 12; i++) {
        const randomIndex = Math.floor(Math.random() * MNEMONIC_WORDS.length);
        words.push(MNEMONIC_WORDS[randomIndex]);
      }
      return words.join(' ');
    };

    const generateAddressFromSeed = (seed) => {
      const cleanSeed = seed.trim().toLowerCase();
      let hash = 0;
      for (let i = 0; i < cleanSeed.length; i++) {
        hash = cleanSeed.charCodeAt(i) + ((hash << 5) - hash);
      }
      let hex = '';
      let value = Math.abs(hash);
      for (let i = 0; i < 40; i++) {
        value = (value * 7) ^ cleanSeed.charCodeAt(i % cleanSeed.length);
        hex += Math.abs(value % 16).toString(16);
      }
      return 'NTC0x' + hex.substring(0, 40).toUpperCase();
    };

    function App() {
      const [user, setUser] = useState(null); 
      const [walletAddress, setWalletAddress] = useState('');
      const [showWalletAddress, setShowWalletAddress] = useState(false);
      const [balance, setBalance] = useState(0.00);
      const [rouletteChips, setRouletteChips] = useState(0);
      const [hexAttempts, setHexAttempts] = useState(0);
      const [history, setHistory] = useState([]);
      const [activeTab, setActiveTab] = useState('auth'); 

      // Autenticação
      const [authMode, setAuthMode] = useState('login'); 
      const [seedPhraseInput, setSeedPhraseInput] = useState('');
      const [generatedSeed, setGeneratedSeed] = useState('');
      const [username, setUsername] = useState('');
      const [authError, setAuthError] = useState('');

      // Toast
      const [toast, setToast] = useState(null);

      // Cooldowns
      const [bonusCooldownTime, setBonusCooldownTime] = useState(0);
      const [chipsCooldownTime, setChipsCooldownTime] = useState(0);
      const [hexAttemptsCooldownTime, setHexAttemptsCooldownTime] = useState(0);

      // Exportação
      const [exportAmount, setExportAmount] = useState('');
      const [targetAddressInput, setTargetAddressInput] = useState('');
      const [generatedVaultCode, setGeneratedVaultCode] = useState('');
      const [generatedVaultFileContent, setGeneratedVaultFileContent] = useState(null);
      const [generatedFileName, setGeneratedFileName] = useState('');
      const [hasCopiedVaultCode, setHasCopiedVaultCode] = useState(false);

      // Importação
      const [importCodeInput, setImportCodeInput] = useState('');
      const [importedFilePayload, setImportedFilePayload] = useState(null);

      // Mineração de Mídia
      const [isMiningActive, setIsMiningActive] = useState(false);
      const [miningLogs, setMiningLogs] = useState([]);
      const [currentAudioLevel, setCurrentAudioLevel] = useState(0);
      const audioContextRef = useRef(null);
      const analyserRef = useRef(null);
      const mediaStreamRef = useRef(null);
      const checkAudioIntervalRef = useRef(null);

      // Roleta NTC
      const [betNtcAmount, setBetNtcAmount] = useState('1.00');
      const [isSpinning, setIsSpinning] = useState(false);
      const [rouletteResult, setRouletteResult] = useState(null);

      // Hex Edit Miner
      const [hexStreamLogs, setHexStreamLogs] = useState([]);
      const [isHexScanning, setIsHexScanning] = useState(false);
      const [targetHexPattern, setTargetHexPattern] = useState('7A9B');
      const [userHexGuess, setUserHexGuess] = useState('');
      const hexIntervalRef = useRef(null);

      const showToastMessage = (msg, type = "success") => {
        setToast({ message: msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleRegisterSeed = (e) => {
        e.preventDefault();
        setAuthError('');
        if (!username.trim()) {
          setAuthError('Escolha um nome de usuário.');
          return;
        }
        const seed = generateNewSeed();
        setGeneratedSeed(seed);
        setAuthMode('seed_display');
      };

      const confirmAndCreateAccount = () => {
        const address = generateAddressFromSeed(generatedSeed);
        const defaultProfile = {
          username: username,
          seed: generatedSeed,
          address: address,
          balance: 0.00,
          chips: 5, 
          hexAttempts: 3, // Começa com 3 tentativas grátis
          history: [{
            id: 'TX-WELCOME',
            type: 'Carteira Criada (+5 Fichas / +3 Tentativas Hex)',
            amount: 0.00,
            date: new Date().toLocaleString()
          }]
        };

        localStorage.setItem(`ntc_user_${username}`, JSON.stringify(defaultProfile));
        localStorage.setItem('ntc_active_session', username);
        
        setUser(username);
        setWalletAddress(address);
        setBalance(0.00);
        setRouletteChips(5);
        setHexAttempts(3);
        setHistory(defaultProfile.history);
        setActiveTab('dashboard');
        checkTimers(username);
        showToastMessage("Carteira Criada com Sucesso!");
      };

      const handleLoginSeed = (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanSeed = seedPhraseInput.trim().toLowerCase();
        if (!cleanSeed) {
          setAuthError('Insira sua frase semente.');
          return;
        }

        let foundUser = null;
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key.startsWith('ntc_user_')) {
            const uData = JSON.parse(localStorage.getItem(key));
            if (uData.seed.trim().toLowerCase() === cleanSeed) {
              foundUser = uData;
              break;
            }
          }
        }

        if (foundUser) {
          setUser(foundUser.username);
          setWalletAddress(foundUser.address);
          setBalance(foundUser.balance || 0);
          setRouletteChips(foundUser.chips || 0);
          setHexAttempts(foundUser.hexAttempts || 0);
          setHistory(foundUser.history || []);
          localStorage.setItem('ntc_active_session', foundUser.username);
          setActiveTab('dashboard');
          checkTimers(foundUser.username);
          showToastMessage(`Sessão Restaurada: @${foundUser.username}`);
        } else {
          setAuthError('Frase semente incorreta ou conta não encontrada.');
        }
      };

      const checkTimers = (currentUsername) => {
        const now = Date.now();
        const twentyFourHours = 24 * 60 * 60 * 1000;
        const threeHours = 3 * 60 * 60 * 1000;
        const fourHours = 4 * 60 * 60 * 1000;

        // Bônus Diário
        const lastBonus = localStorage.getItem(`ntc_last_bonus_${currentUsername}`);
        if (lastBonus && now - parseInt(lastBonus) < twentyFourHours) {
          setBonusCooldownTime(twentyFourHours - (now - parseInt(lastBonus)));
        } else {
          setBonusCooldownTime(0);
        }

        // Fichas Roleta
        const lastChips = localStorage.getItem(`ntc_last_chips_${currentUsername}`);
        if (lastChips && now - parseInt(lastChips) < threeHours) {
          setChipsCooldownTime(threeHours - (now - parseInt(lastChips)));
        } else {
          setChipsCooldownTime(0);
        }

        // Tentativas Hex (4h)
        const lastHex = localStorage.getItem(`ntc_last_hex_${currentUsername}`);
        if (lastHex && now - parseInt(lastHex) < fourHours) {
          setHexAttemptsCooldownTime(fourHours - (now - parseInt(lastHex)));
        } else {
          setHexAttemptsCooldownTime(0);
        }
      };

      useEffect(() => {
        const timer = setInterval(() => {
          if (bonusCooldownTime > 0) setBonusCooldownTime(prev => (prev > 1000 ? prev - 1000 : 0));
          if (chipsCooldownTime > 0) setChipsCooldownTime(prev => (prev > 1000 ? prev - 1000 : 0));
          if (hexAttemptsCooldownTime > 0) setHexAttemptsCooldownTime(prev => (prev > 1000 ? prev - 1000 : 0));
        }, 1000);
        return () => clearInterval(timer);
      }, [bonusCooldownTime, chipsCooldownTime, hexAttemptsCooldownTime]);

      const handleClaimDailyBonus = () => {
        if (bonusCooldownTime > 0) return;
        window.open('https://asiafilm.org/4/5e37de5833637b26a4669e3ab8a7b0c4', '_blank');

        const amt = 1.00;
        const nextBalance = Number((balance + amt).toFixed(4));
        const newTx = {
          id: 'BONUS-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
          type: 'Bônus Diário Resgatado',
          amount: amt,
          date: new Date().toLocaleString()
        };
        const nextHistory = [newTx, ...history];

        setBalance(nextBalance);
        setHistory(nextHistory);
        saveUserData(nextBalance, rouletteChips, hexAttempts, nextHistory);
        localStorage.setItem(`ntc_last_bonus_${user}`, Date.now().toString());
        setBonusCooldownTime(24 * 60 * 60 * 1000);
        showToastMessage("Parabéns! +1.00 NTC adicionado à sua carteira.");
      };

      const handleClaimRouletteChips = () => {
        if (chipsCooldownTime > 0) return;
        window.open('https://asiafilm.org/4/5e37de5833637b26a4669e3ab8a7b0c4', '_blank');

        const addedChips = 5;
        const nextChips = rouletteChips + addedChips;
        setRouletteChips(nextChips);
        saveUserData(balance, nextChips, hexAttempts, history);
        localStorage.setItem(`ntc_last_chips_${user}`, Date.now().toString());
        setChipsCooldownTime(3 * 60 * 60 * 1000);
        showToastMessage("Anúncio visualizado! +5 Fichas liberadas para a Roleta.");
      };

      // Resgatar 5 Tentativas Hex via Anúncio (4h)
      const handleClaimHexAttempts = () => {
        if (hexAttemptsCooldownTime > 0) return;
        window.open('https://asiafilm.org/4/5e37de5833637b26a4669e3ab8a7b0c4', '_blank');

        const addedAttempts = 5;
        const nextAttempts = hexAttempts + addedAttempts;
        setHexAttempts(nextAttempts);
        saveUserData(balance, rouletteChips, nextAttempts, history);
        localStorage.setItem(`ntc_last_hex_${user}`, Date.now().toString());
        setHexAttemptsCooldownTime(4 * 60 * 60 * 1000);
        showToastMessage("Anúncio visualizado! +5 Tentativas liberadas para o Hex Edit Miner.");
      };

      const formatTimeLeft = (ms) => {
        const totalSecs = Math.floor(ms / 1000);
        const hours = Math.floor(totalSecs / 3600);
        const minutes = Math.floor((totalSecs % 3600) / 60);
        const seconds = totalSecs % 60;
        return `${hours}h ${minutes}m ${seconds}s`;
      };

      useEffect(() => {
        const activeUser = localStorage.getItem('ntc_active_session');
        if (activeUser) {
          const data = JSON.parse(localStorage.getItem(`ntc_user_${activeUser}`));
          if (data) {
            setUser(data.username);
            setWalletAddress(data.address);
            setBalance(data.balance || 0);
            setRouletteChips(data.chips || 0);
            setHexAttempts(data.hexAttempts || 0);
            setHistory(data.history || []);
            setActiveTab('dashboard');
            checkTimers(data.username);
          }
        }
      }, []);

      const saveUserData = (newBal, newChips, newHexAttempts, newHist) => {
        if (!user) return;
        const data = JSON.parse(localStorage.getItem(`ntc_user_${user}`)) || {};
        data.balance = newBal;
        data.chips = newChips;
        data.hexAttempts = newHexAttempts;
        data.history = newHist;
        localStorage.setItem(`ntc_user_${user}`, JSON.stringify(data));
      };

      const handleGenerateVaultFile = (e) => {
        e.preventDefault();
        const amt = parseFloat(exportAmount);
        const targetAddress = targetAddressInput.trim().toUpperCase();

        if (isNaN(amt) || amt <= 0) {
          showToastMessage("Insira um valor válido para exportar.", "error");
          return;
        }
        if (!targetAddress || !targetAddress.startsWith('NTC0X')) {
          showToastMessage("Digite um endereço de carteira NTC de destino válido!", "error");
          return;
        }
        if (targetAddress === walletAddress.trim().toUpperCase()) {
          showToastMessage("BLOQUEIO: O endereço de destino não pode ser a sua própria carteira!", "error");
          return;
        }
        if (balance < amt) {
          showToastMessage("Saldo NTC insuficiente para gerar este arquivo.", "error");
          return;
        }

        const nextBalance = Number((balance - amt).toFixed(4));
        const txId = 'VAULT-OUT-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        const newTx = {
          id: txId,
          type: `Exportação para ${targetAddress.substring(0, 10)}... (${amt} NTC)`,
          amount: -amt,
          date: new Date().toLocaleString()
        };
        const nextHistory = [newTx, ...history];

        setBalance(nextBalance);
        setHistory(nextHistory);
        saveUserData(nextBalance, rouletteChips, hexAttempts, nextHistory);

        const secretCode = 'NTC-SEC-' + Math.random().toString(36).substr(2, 9).toUpperCase() + '-' + Date.now().toString(36).toUpperCase();
        const filePayload = {
          version: "3.0-STRICT",
          vaultId: Math.random().toString(36).substr(2, 12),
          sender: user,
          senderAddress: walletAddress,
          recipientAddress: targetAddress,
          amount: amt,
          secretCode: secretCode,
          timestamp: Date.now(),
          checksum: Math.random().toString(36).substring(2)
        };

        const encodedData = btoa(JSON.stringify(filePayload));
        setGeneratedVaultCode(secretCode);
        setGeneratedVaultFileContent(encodedData);
        setGeneratedFileName(`NTC_Vault_${amt}_NTC_${Date.now()}.ntcsecure`);
        setHasCopiedVaultCode(false);
        setExportAmount('');
        setTargetAddressInput('');
        showToastMessage("Arquivo gerado com sucesso! Anote o código de resgate.");
      };

      const downloadVaultFile = () => {
        if (!hasCopiedVaultCode) {
          showToastMessage("Você precisa copiar e anotar o código temporário antes de baixar!", "error");
          return;
        }
        const blob = new Blob([generatedVaultFileContent], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = generatedFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToastMessage("Arquivo seguro baixado com sucesso!");
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const usedFiles = JSON.parse(localStorage.getItem('ntc_used_vault_files')) || {};
        if (usedFiles[file.name]) {
          showToastMessage("ERRO: Este arquivo já foi upado neste computador!", "error");
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const decoded = JSON.parse(atob(event.target.result));
            if (!decoded.secretCode || !decoded.amount || !decoded.senderAddress) throw new Error("Formato inválido.");

            if (decoded.senderAddress.trim().toUpperCase() === walletAddress.trim().toUpperCase()) {
              showToastMessage("BLOQUEIO: Não é permitido importar arquivos exportados por si mesmo!", "error");
              setImportedFilePayload(null);
              e.target.value = "";
              return;
            }

            if (decoded.recipientAddress && decoded.recipientAddress.trim().toUpperCase() !== walletAddress.trim().toUpperCase()) {
              showToastMessage("BLOQUEIO: Este arquivo foi gerado para OUTRO endereço de carteira!", "error");
              setImportedFilePayload(null);
              e.target.value = "";
              return;
            }

            setImportedFilePayload({ ...decoded, fileName: file.name });
            showToastMessage("Arquivo validado exclusivamente para a sua carteira!");
          } catch (err) {
            showToastMessage("Arquivo corrompido ou formato inválido.", "error");
          }
        };
        reader.readAsText(file);
      };

      const confirmImportVault = () => {
        if (!importedFilePayload) return;

        if (importedFilePayload.senderAddress.trim().toUpperCase() === walletAddress.trim().toUpperCase()) {
          showToastMessage("ERRO: Este arquivo pertence a esta própria carteira!", "error");
          return;
        }

        if (importedFilePayload.recipientAddress && importedFilePayload.recipientAddress.trim().toUpperCase() !== walletAddress.trim().toUpperCase()) {
          showToastMessage("ERRO: Sua carteira não é a destinatária deste arquivo!", "error");
          return;
        }

        if (importCodeInput.trim() !== importedFilePayload.secretCode.trim()) {
          showToastMessage("O código temporário inserido não confere com o arquivo!", "error");
          return;
        }

        const usedFiles = JSON.parse(localStorage.getItem('ntc_used_vault_files')) || {};
        if (usedFiles[importedFilePayload.fileName]) {
          showToastMessage("Este arquivo já foi resgatado anteriormente!", "error");
          return;
        }

        usedFiles[importedFilePayload.fileName] = true;
        localStorage.setItem('ntc_used_vault_files', JSON.stringify(usedFiles));

        const amt = importedFilePayload.amount;
        const nextBalance = Number((balance + amt).toFixed(4));
        const newTx = {
          id: 'VAULT-IN-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
          type: `Resgate de Arquivo Seguro (${amt} NTC)`,
          amount: amt,
          date: new Date().toLocaleString()
        };
        const nextHistory = [newTx, ...history];

        setBalance(nextBalance);
        setHistory(nextHistory);
        saveUserData(nextBalance, rouletteChips, hexAttempts, nextHistory);
        setImportedFilePayload(null);
        setImportCodeInput('');
        showToastMessage(`Sucesso! +${amt} NTC creditados na sua carteira.`);
      };

      const spinRoulette = () => {
        const betAmt = parseFloat(betNtcAmount);
        if (isNaN(betAmt) || betAmt <= 0) {
          showToastMessage("Insira um valor válido de NTC para apostar.", "error");
          return;
        }
        if (balance < betAmt) {
          showToastMessage("Saldo NTC insuficiente para realizar esta aposta.", "error");
          return;
        }
        if (rouletteChips <= 0) {
          showToastMessage("Você precisa de pelo menos 1 Ficha! Resgate assistindo ao anúncio.", "error");
          return;
        }

        setIsSpinning(true);
        setRouletteResult(null);

        const nextChips = rouletteChips - 1;
        const balanceAfterBet = Number((balance - betAmt).toFixed(4));
        setRouletteChips(nextChips);
        setBalance(balanceAfterBet);

        setTimeout(() => {
          const rand = Math.random();
          let multiplier = 0;
          if (rand < 0.70) multiplier = 0;
          else if (rand < 0.90) multiplier = 2;
          else multiplier = 20;

          const prize = Number((betAmt * multiplier).toFixed(4));
          const finalBalance = Number((balanceAfterBet + prize).toFixed(4));
          const netChange = prize - betAmt;

          setBalance(finalBalance);
          const newTx = {
            id: 'ROULETTE-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
            type: `Roleta NTC (${multiplier}x apostando ${betAmt} NTC)`,
            amount: netChange,
            date: new Date().toLocaleString()
          };
          const nextHistory = [newTx, ...history];
          setHistory(nextHistory);
          saveUserData(finalBalance, nextChips, hexAttempts, nextHistory);
          setRouletteResult({ multiplier, prize, betAmt });
          setIsSpinning(false);

          if (multiplier > 0) {
            showToastMessage(`🎰 INCRÍVEL! Caiu ${multiplier}x! Você ganhou ${prize} NTC!`);
          } else {
            showToastMessage("Caiu 0x. Mais sorte na próxima!", "error");
          }
        }, 1500);
      };

      const startHexScanner = () => {
        if (isHexScanning) return;
        setIsHexScanning(true);
        const randomHexTarget = Math.floor(Math.random() * 65535).toString(16).toUpperCase().padStart(4, '0');
        setTargetHexPattern(randomHexTarget);
        showToastMessage("Escaneamento de requests iniciado. Analisando blocos de Hex...");

        hexIntervalRef.current = setInterval(() => {
          const randomChunk = Math.floor(Math.random() * 16777215).toString(16).toUpperCase().padStart(6, '0');
          const mockAddress = '0x' + Math.floor(Math.random() * 65535).toString(16).toUpperCase();
          const logEntry = `${mockAddress}: ${randomChunk.match(/.{1,2}/g).join(' ')}`;
          setHexStreamLogs(prev => [logEntry, ...prev.slice(0, 15)]);
        }, 800);
      };

      const stopHexScanner = () => {
        if (hexIntervalRef.current) clearInterval(hexIntervalRef.current);
        setIsHexScanning(false);
        showToastMessage("Escaneamento de requests pausado.");
      };

      const submitHexDecryption = () => {
        if (hexAttempts <= 0) {
          showToastMessage("Tentativas esgotadas! Assista ao anúncio para liberar mais 5 tentativas.", "error");
          return;
        }

        const guess = userHexGuess.trim().toUpperCase();
        if (!guess || guess.length !== 4) {
          showToastMessage("Insira uma combinação exata de 4 caracteres Hex (ex: 4F9C).", "error");
          return;
        }

        // Consome 1 tentativa
        const nextAttempts = hexAttempts - 1;
        setHexAttempts(nextAttempts);

        const rewardNtc = 0.50;
        const penaltyNtc = 0.25;

        if (guess === targetHexPattern) {
          const nextBal = Number((balance + rewardNtc).toFixed(4));
          setBalance(nextBal);
          const newTx = {
            id: 'HEX-WIN-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
            type: `Hex Edit Miner (Acertou ${targetHexPattern})`,
            amount: rewardNtc,
            date: new Date().toLocaleString()
          };
          const nextHistory = [newTx, ...history];
          setHistory(nextHistory);
          saveUserData(nextBal, rouletteChips, nextAttempts, nextHistory);
          showToastMessage(`🎉 DECRIPTADO! +${rewardNtc} NTC encontrados no bloco!`);
          setTargetHexPattern(Math.floor(Math.random() * 65535).toString(16).toUpperCase().padStart(4, '0'));
          setUserHexGuess('');
        } else {
          const nextBal = Number((balance - penaltyNtc).toFixed(4));
          setBalance(nextBal);
          const newTx = {
            id: 'HEX-LOSS-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
            type: `Hex Edit Miner (Erro de Decodificação)`,
            amount: -penaltyNtc,
            date: new Date().toLocaleString()
          };
          const nextHistory = [newTx, ...history];
          setHistory(nextHistory);
          saveUserData(nextBal, rouletteChips, nextAttempts, nextHistory);
          showToastMessage(`❌ ERRO! -1 Tentativa. -${penaltyNtc} NTC perdidos.`, "error");

        if (audioContextRef.current) audioContextRef.current.close();
        setIsMiningActive(false);
        setCurrentAudioLevel(0);
        showToastMessage("Mineração de NTC pausada.");
      };

        stopMining();
        try {
          let stream;
          if (mode === 'tab') {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: true,
              audio: { echoCancellation: false, noiseSuppression: false }
            });
          } else {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          }

          const audioTracks = stream.getAudioTracks();
          if (audioTracks.length === 0) {
            showToastMessage("Atenção: Marque a opção 'Compartilhar áudio da aba/sistema'!", "error");
            stream.getTracks().forEach(t => t.stop());
            return;

          mediaStreamRef.current = stream;
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioContextRef.current = new AudioContext();
          analyserRef.current = audioContextRef.current.createAnalyser();
          
          const audioStreamOnly = new MediaStream([audioTracks[0]]);

                  <div className="bg-[#0c0c16] border border-purple-900/40 rounded-2xl p-6 max-w-3xl mx-auto space-y-6 animate-fadeIn">
                    <div className="text-center">
                      <span className="text-[10px] uppercase font-bold bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full border border-cyan-500/20 font-orbitron">Hex Data Recovery</span>
                      <h3 className="text-3xl font-orbitron font-black text-white mt-2">💻 Hex Edit Miner</h3>
                      <p className="text-xs text-gray-400 mt-1">Capture requests, decodifique o padrão correto e resgate NTC (ou perca saldo se errar!).</p>
                    </div>

                    {/* PAINEL DE TENTATIVAS HEX E ANÚNCIO (4H) */}
                    <div className="bg-black/60 border border-cyan-900/50 rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                      <div>
                        <span className="text-[10px] text-gray-400 uppercase block font-orbitron">Tentativas Disponíveis</span>
                        <span className="text-3xl font-orbitron font-black text-cyan-400">{hexAttempts} Tentativas</span>
                      </div>
                      <div>
                        {hexAttemptsCooldownTime > 0 ? (
                          <button disabled className="px-4 py-2.5 bg-gray-800 text-gray-400 font-orbitron text-xs font-bold rounded-xl cursor-not-allowed">
                            +5 TENTATIVAS EM: {formatTimeLeft(hexAttemptsCooldownTime)}
                          </button>
                        ) : (
                          <button 
                            onClick={handleClaimHexAttempts}
                            className="px-5 py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 text-white font-orbitron font-bold text-xs rounded-xl shadow-lg transition animate-pulse"
                          >
                            🎟️ VER ANÚNCIO (+5 TENTATIVAS)
                          </button>
                        )}
                      </div>
                    </div>

                    <div className="flex justify-center gap-4">
                      {!isHexScanning ? (
                        <button onClick={startHexScanner} className="px-6 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-orbitron font-bold text-xs rounded-xl shadow-lg">🔍 INICIAR CAPTURA DE REQUESTS HEX</button>
                      ) : (
                        <button onClick={stopHexScanner} className="px-6 py-3 bg-red-600 text-white font-orbitron font-bold text-xs rounded-xl animate-pulse">PARAR CAPTURA</button>
                      )}
                    </div>

                    <div className="bg-black/80 border border-cyan-900/50 rounded-xl p-4 h-44 overflow-y-auto font-mono text-xs space-y-1">
                      <div className="text-cyan-400 font-bold mb-2 border-b border-cyan-950 pb-1">STREAM DE REQUESTS DO SISTEMA (HEX DUMP):</div>
                      {hexStreamLogs.length === 0 ? (
                        <p className="text-gray-600 italic">Clique em iniciar para monitorar tráfego...</p>
                      ) : (
                        hexStreamLogs.map((log, index) => <div key={index} className="text-emerald-400/90 tracking-wider">{log}</div>)
                      )}
                    </div>

                    <div className="bg-purple-950/20 border border-purple-500/30 rounded-xl p-5 space-y-4 text-center">
                      <div className="flex justify-between items-center text-xs">
                        <span className="text-gray-400">Alvo Oculto: <strong className="text-yellow-400 font-mono">★★★★</strong></span>
                        <span className="text-emerald-400 font-bold">Acerto: +0.50 NTC | Erro: -0.25 NTC</span>
                      </div>
                      <div className="flex gap-2 justify-center max-w-sm mx-auto">
                        <input type="text" maxLength="4" value={userHexGuess} onChange={(e) => setUserHexGuess(e.target.value)} placeholder="EX: 7A9B" className="bg-black/60 border border-purple-900/60 rounded-xl px-4 py-2 text-center text-lg font-mono text-cyan-300 tracking-widest uppercase focus:outline-none w-full" />
                        <button onClick={submitHexDecryption} className="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-orbitron font-bold text-xs rounded-xl shadow-lg">DECRIPTAR</button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          <footer className="border-t border-purple-950 bg-black/40 px-6 py-4 text-center mt-8 text-[11px] text-gray-500 font-sans">
            <p>Notoriety Coin Secure Vault &copy; 2026. Segurança total com arquivos e chaves exclusivas.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
